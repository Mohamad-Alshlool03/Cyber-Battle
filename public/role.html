<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Role</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    /* ===== Body & Background ===== */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      overflow: hidden;
    }

    /* ===== Glowing Title ===== */
    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      color: #00ffea;
      text-shadow: 0 0 10px #00ffea, 0 0 20px #00ffea, 0 0 30px #00ffea;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 5px #00ffea, 0 0 10px #00ffea; }
      100% { text-shadow: 0 0 20px #00ffea, 0 0 40px #00ffea, 0 0 60px #00ffea; }
    }

    /* ===== Buttons ===== */
    button {
      background: linear-gradient(45deg, #ff0055, #ff5500);
      border: none;
      border-radius: 12px;
      padding: 15px 30px;
      margin: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      color: white;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 0 10px #ff0055, 0 0 20px #ff5500;
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px #ff00ff, 0 0 40px #ff5500, 0 0 60px #ff0055;
    }

    /* ===== Secondary Button ===== */
    button#backBtn {
      background: linear-gradient(45deg, #00cfff, #0055ff);
      box-shadow: 0 0 10px #00cfff, 0 0 20px #0055ff;
    }

    button#backBtn:hover {
      box-shadow: 0 0 20px #00ffff, 0 0 40px #0055ff, 0 0 60px #00cfff;
    }

    /* ===== Subtext ===== */
    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #a0a0a0;
    }

    /* ===== Floating Particles ===== */
    .particle {
      position: absolute;
      width: 5px;
      height: 5px;
      background: #00ffea;
      border-radius: 50%;
      opacity: 0.7;
      animation: float 5s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0) translateX(0); }
      100% { transform: translateY(-100vh) translateX(50px); }
    }
  </style>
</head>
<body>

  <h1 id="teamTitle"></h1>
  <p>Choose your role:</p>

  <button onclick="chooseRole('attack')">⚔️ Attack</button>
  <button onclick="chooseRole('defense')">🛡️ Defense</button>

  <br><br>
  <button id="backBtn" onclick="goBack()">⬅️ Change Team</button>

  <script>
    // ===== Floating Particles =====
    for (let i = 0; i < 50; i++) {
      let particle = document.createElement('div');
      particle.classList.add('particle');
      particle.style.left = Math.random() * window.innerWidth + 'px';
      particle.style.top = Math.random() * window.innerHeight + 'px';
      particle.style.animationDuration = 3 + Math.random() * 5 + 's';
      document.body.appendChild(particle);
    }

    // ===== Team Check =====
    const team = localStorage.getItem("team");

    if (!team) {
      window.location.href = "game.html";
    }

    document.getElementById("teamTitle").innerText =
      "You are in Team " + team;

    // ===== Role Selection =====
    function chooseRole(role) {
      localStorage.setItem("role", role);

      if (role === "attack") {
        window.location.href = "attack.html";
      } else {
        window.location.href = "defense.html";
      }
    }

    function goBack() {
      window.location.href = "game.html";
    }
  </script>
</body>
</html>
