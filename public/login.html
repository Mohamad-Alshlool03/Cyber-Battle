<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyber Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Orbitron;
background:black;
overflow:hidden;
}

/* Intro */

#intro{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
z-index:9999;
}

#intro video{
width:100%;
height:100%;
object-fit:cover;
}

/* Skip */

#skip{
position:absolute;
top:20px;
right:20px;
z-index:10000;
}

/* Logo */

#logoScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#020617;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:5000;
}

/* Login */

#loginPage{
display:none;
height:100vh;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
justify-content:center;
align-items:center;
}

.container{
background:rgba(0,0,0,0.7);
padding:40px;
border-radius:15px;
border:2px solid cyan;
text-align:center;
box-shadow:0 0 20px cyan;
}

</style>
</head>

<body>

<!-- INTRO -->

<div id="intro">

<button id="skip" onclick="skipIntro()" class="btn btn-danger">
Skip
</button>

<video id="introVideo" autoplay muted playsinline>
<source src="./video/intro.mp4" type="video/mp4">
</video>

</div>

<!-- LOGO -->

<div id="logoScreen">

<img src="./images/logo.png" width="220">

<h3 class="text-info mt-3">CYBER GAME</h3>

</div>

<!-- LOGIN -->

<div id="loginPage" class="d-flex">

<div class="container">

<h2 class="text-info">Login</h2>

<input id="username" class="form-control mb-2" placeholder="Username">

<input id="password" type="password" class="form-control mb-3" placeholder="Password">

<button onclick="login()" class="btn btn-primary w-100">
Login
</button>

<p id="result" class="text-danger mt-2"></p>

</div>

</div>

<script>

const intro=document.getElementById("intro");
const video=document.getElementById("introVideo");
const logo=document.getElementById("logoScreen");
const loginPage=document.getElementById("loginPage");

function showLogin(){

intro.style.display="none";

logo.style.display="flex";

setTimeout(()=>{

logo.style.display="none";
loginPage.style.display="flex";

},2000);

}

video.onended=showLogin;

function skipIntro(){

video.pause();
showLogin();

}

function login(){

fetch("/api/login",{

method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:username.value,
password:password.value
})

})

.then(r=>r.json())
.then(d=>{

if(d.success){
location.href="game.html";
}else{
result.innerText="Login Failed";
}

});

}

</script>

</body>
</html>
